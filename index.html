<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- interactive-widget: let the soft keyboard resize the layout viewport (Chrome/Android) so
         the bottom nav rides above it instead of sitting under it -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#030712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>LibreLock</title>
    <script src="/theme-init.js"></script>
    <!-- The boot shell: painted before any bundle is parsed, so a slow or unreachable server shows
         the app's own background and a spinner instead of a blank white page. theme-init.js has
         already set html.dark by this point, and Vue wipes #app when it mounts over it.
         Inline <style> only - the CSP allows inline styles but not inline scripts. -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f9fafb;
      }

      html.dark,
      html.dark body {
        background: #030712;
      }

      #app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #6b7280;
        opacity: 0;
        animation: app-boot-fade 0.2s ease-in 0.4s forwards;
      }

      #app-boot .spinner {
        width: 2rem;
        height: 2rem;
        border: 3px solid rgb(107 114 128 / 25%);
        border-top-color: #6b7280;
        border-radius: 9999px;
        animation: app-boot-spin 0.8s linear infinite;
      }

      #app-boot .stall {
        display: none;
        max-width: 22rem;
        margin: 0;
        text-align: center;
        font-size: 0.875rem;
        line-height: 1.5;
      }

      #app-boot.is-stalled .stall {
        display: block;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes app-boot-fade {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-boot .spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-boot">
        <div class="spinner"></div>
        <p class="stall">
          LibreLock is taking longer than usual to load. If this instance is only reachable over a
          VPN, check that the connection is up, then reload the page.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
